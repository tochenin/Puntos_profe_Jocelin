<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Puntos - Aula Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .dark-btn { background: #1e293b; border: 1px solid #334155; transition: all 0.2s ease; }
    .dark-btn:hover { background: #334155; border-color: #6366f1; transform: translateY(-1px); }
  </style>
</head>
<body class="min-h-screen pb-12">

  <header class="glass-card sticky top-0 z-50 border-b border-slate-700/50 bg-slate-900/80 px-6 py-4 mb-8">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
          <i class="fa-solid fa-graduation-cap text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-100">Panel de Puntos de Aula</h1>
          <p class="text-xs text-slate-400">Gestión de conducta y recompensas</p>
        </div>
      </div>

      <div class="flex items-center gap-3 w-full md:w-auto">
        <label class="text-sm font-medium text-slate-300 whitespace-nowrap">Curso:</label>
        <select id="courseSelect" onchange="loadCourseData()" class="w-full md:w-48 bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-indigo-500 focus:border-indigo-500">
          <option value="5A">5° Básico A</option>
          <option value="5B">5° Básico B</option>
          <option value="6A">6° Básico A</option>
          <option value="6B">6° Básico B</option>
        </select>
        <button onclick="openRewardModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-lg shadow-lg shadow-indigo-600/20 transition flex items-center gap-2">
          <i class="fa-solid fa-gift"></i> Catálogo
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <section class="lg:col-span-2 space-y-6">
      
      <!-- Criterios y Puntos -->
      <div class="glass-card p-6 rounded-2xl">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">1. Seleccionar Criterio de Evaluación</h2>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 mb-6" id="categoryContainer">
          <button onclick="selectCategory('Participación', this)" class="cat-btn dark-btn p-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-2 border-indigo-500/50 bg-indigo-950/30 text-indigo-300"><i class="fa-solid fa-hand text-base"></i> Participación</button>
          <button onclick="selectCategory('Convivencia', this)" class="cat-btn dark-btn p-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-2 text-slate-300"><i class="fa-solid fa-users text-base"></i> Convivencia</button>
          <button onclick="selectCategory('Responsabilidad', this)" class="cat-btn dark-btn p-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-2 text-slate-300"><i class="fa-solid fa-clock text-base"></i> Responsabilidad</button>
          <button onclick="selectCategory('Orden', this)" class="cat-btn dark-btn p-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-2 text-slate-300"><i class="fa-solid fa-broom text-base"></i> Orden</button>
          <button onclick="selectCategory('Tareas', this)" class="cat-btn dark-btn p-3 rounded-xl text-xs font-semibold flex flex-col items-center gap-2 text-slate-300"><i class="fa-solid fa-book text-base"></i> Tareas</button>
        </div>

        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">2. Otorgar Puntos</h2>
        <div class="flex flex-wrap gap-3">
          <button onclick="addPoints(1)" class="flex-1 min-w-[70px] py-3 dark-btn rounded-xl font-bold text-emerald-400 border-emerald-900/50 hover:border-emerald-500/50 hover:bg-emerald-950/30 text-lg">+1</button>
          <button onclick="addPoints(2)" class="flex-1 min-w-[70px] py-3 dark-btn rounded-xl font-bold text-emerald-400 border-emerald-900/50 hover:border-emerald-500/50 hover:bg-emerald-950/30 text-lg">+2</button>
          <button onclick="addPoints(3)" class="flex-1 min-w-[70px] py-3 dark-btn rounded-xl font-bold text-emerald-400 border-emerald-900/50 hover:border-emerald-500/50 hover:bg-emerald-950/30 text-lg">+3</button>
          <button onclick="addPoints(4)" class="flex-1 min-w-[70px] py-3 dark-btn rounded-xl font-bold text-emerald-400 border-emerald-900/50 hover:border-emerald-500/50 hover:bg-emerald-950/30 text-lg">+4</button>
          <button onclick="addPoints(5)" class="flex-1 min-w-[70px] py-3 dark-btn rounded-xl font-bold text-emerald-400 border-emerald-900/50 hover:border-emerald-500/50 hover:bg-emerald-950/30 text-lg">+5</button>
        </div>
      </div>

      <!-- Lista de Estudiantes con opción de Agregar -->
      <div class="glass-card p-6 rounded-2xl">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <h2 class="text-base font-bold text-slate-200">Estudiantes del Curso (<span id="studentCount">0</span>)</h2>
          <div class="flex gap-2 w-full sm:w-auto">
            <button onclick="selectAll(true)" class="text-xs px-3 py-1.5 dark-btn rounded-lg text-slate-300">Seleccionar todos</button>
            <button onclick="selectAll(false)" class="text-xs px-3 py-1.5 dark-btn rounded-lg text-slate-400">Deseleccionar</button>
          </div>
        </div>

        <!-- Formulario para Agregar Estudiante -->
        <div class="flex gap-2 mb-4 bg-slate-900/50 p-3 rounded-xl border border-indigo-500/20">
          <input type="text" id="newStudentName" placeholder="Escribe el nombre y apellido del estudiante..." class="flex-1 bg-slate-
